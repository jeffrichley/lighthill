name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Test the supported-Python floor + current. lighthill targets
        # >=3.11 (deployment target, raised 2026-07-09); 3.12 is the dev default.
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
      - run: uv sync --locked
      - run: just check
      # Upload coverage to Codecov once per run (the 3.12 matrix leg only) via
      # the account-wide GitHub App (tokenless). Never reddens CI.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      # Patch-coverage gate. ``just check`` writes coverage.xml via pytest-cov
      # (configured in pyproject addopts). diff-cover compares the diff against
      # the PR base and fails if patch coverage falls below 80%. PR-only —
      # push/merge_group have no base ref to diff against.
      - name: Patch coverage gate (diff-cover)
        if: github.event_name == 'pull_request'
        run: uv run --no-sync diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80
      - run: uv cache prune --ci
